<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - TechStore</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
        header { background: #1a73e8; color: white; padding: 1rem 2rem; }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .nav-links a { color: white; text-decoration: none; margin-left: 2rem; }
        .contact-section { max-width: 600px; margin: 3rem auto; padding: 0 2rem; }
        .contact-section h1 { color: #333; margin-bottom: 1rem; text-align: center; }
        .contact-section p { color: #666; text-align: center; margin-bottom: 2rem; }
        .form-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .btn-submit { background: #1a73e8; color: white; padding: 1rem 2rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; }
        .btn-submit:hover { background: #1557b0; }
        footer { background: #333; color: white; text-align: center; padding: 2rem; margin-top: 3rem; }
    </style>
    <!-- Google Tag Manager -->
    <script>
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5DBGH2X5');
    </script>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5DBGH2X5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <header>
        <nav>
            <div class="logo">TechStore</div>
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="index.html#productos">Productos</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>
    </header>

    <section class="contact-section">
        <h1>Contáctanos</h1>
        <p>¿Tienes preguntas? Estamos aquí para ayudarte.</p>
        <div class="form-card">
            <form id="contactForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Asunto</label>
                    <select id="subject" name="subject">
                        <option value="consulta">Consulta general</option>
                        <option value="soporte">Soporte técnico</option>
                        <option value="ventas">Ventas</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Enviar mensaje</button>
            </form>
        </div>
    </section>

    <footer>
        <p>TechStore Demo - Para práctica de Analytics</p>
    </footer>

    <script>
        window.dataLayer = window.dataLayer || [];
        
        dataLayer.push({
            event: 'page_view',
            page_type: 'contact',
            page_title: document.title,
            page_location: window.location.href
        });

        // Tracking de interacción con el formulario
        document.getElementById('contactForm').addEventListener('focusin', function(e) {
            if (!window.formStarted) {
                window.formStarted = true;
                dataLayer.push({
                    event: 'form_start',
                    form_name: 'contacto',
                    form_id: 'contactForm'
                });
            }
        });

        function handleSubmit(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            dataLayer.push({
                event: 'form_submit',
                form_name: 'contacto',
                form_id: 'contactForm',
                form_data: {
                    subject: formData.get('subject')
                }
            });
            
            alert('¡Mensaje enviado! (Demo)');
            e.target.reset();
            window.formStarted = false;
        }
    </script>
</body>
</html>
